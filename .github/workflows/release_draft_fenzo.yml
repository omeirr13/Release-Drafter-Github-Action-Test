name: Fenzo Release Drafter

on:
  push:
    branches:
      - stable_fenzo

jobs:
  update_fenzo_release_draft:
    runs-on: ubuntu-latest
    steps:
      # Maintains the fenzo release draft as changes flow into stable_fenzo.
      - uses: release-drafter/release-drafter@v5
        with:
          config-name: release-drafter-fenzo.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
